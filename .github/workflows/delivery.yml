# ---------------------------------------------------------------------------
# Continuous Delivery — supply-chain-secured images + verified blue-green deploy.
#
#  build ─▶ scan (Trivy gate) ─▶ SBOM ─▶ push to GHCR ─▶ sign + attest (cosign)
#     └──▶ deploy to ephemeral kind cluster ─▶ blue-green switch ─▶ rollback drill
#     └──▶ GitOps: bump staging overlay image tags (Argo CD syncs)
# ---------------------------------------------------------------------------
name: Delivery

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  TRIVY_IMAGE: aquasec/trivy:0.58.1

jobs:
  images:
    name: Build · scan · SBOM · push · sign (${{ matrix.component }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write          # keyless cosign signing via GitHub OIDC
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        component: [backend, frontend]
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Compute names
        id: vars
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=${REGISTRY}/${owner}/devsecops360-${{ matrix.component }}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.tag }}
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (load locally for scanning first — nothing is pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.component }}
          file: docker/${{ matrix.component }}.Dockerfile
          load: true
          tags: scan-target:${{ matrix.component }}
          build-args: |
            APP_VERSION=${{ steps.vars.outputs.tag }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Trivy image scan — FAIL on fixable CRITICAL
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/src" "$TRIVY_IMAGE" \
            image --severity CRITICAL --ignore-unfixed --exit-code 1 \
            --format table scan-target:${{ matrix.component }}
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/src" "$TRIVY_IMAGE" \
            image --severity HIGH,CRITICAL --format sarif --output /src/trivy-image.sarif \
            scan-target:${{ matrix.component }}

      - name: Generate SBOMs (SPDX + CycloneDX)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/src" "$TRIVY_IMAGE" \
            image --format spdx-json --output /src/sbom-${{ matrix.component }}.spdx.json scan-target:${{ matrix.component }}
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/src" "$TRIVY_IMAGE" \
            image --format cyclonedx --output /src/sbom-${{ matrix.component }}.cdx.json scan-target:${{ matrix.component }}

      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.component }}
          path: |
            sbom-${{ matrix.component }}.*.json
            trivy-image.sarif

      - name: Push (same build, from cache)
        id: push
        uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.component }}
          file: docker/${{ matrix.component }}.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.vars.outputs.tag }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          provenance: mode=max    # SLSA build provenance attestation
          sbom: true

      - uses: sigstore/cosign-installer@v3

      - name: Sign image and attest SBOM (keyless, Sigstore)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE: ${{ steps.vars.outputs.image }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign attest --yes --type cyclonedx \
            --predicate sbom-${{ matrix.component }}.cdx.json "${IMAGE}@${DIGEST}"

      - name: Verify signature (what a cluster admission policy would check)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE: ${{ steps.vars.outputs.image }}
        run: |
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          echo "signature verified for ${IMAGE}@${DIGEST}"

  deploy-verify:
    name: Deploy to ephemeral kind + blue-green + rollback drill
    needs: images
    runs-on: ubuntu-latest
    env:
      NAMESPACE: devsecops360-dev
      OVERLAY: development
    steps:
      - uses: actions/checkout@v7

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: devsecops360
          version: v0.26.0

      - name: Install Traefik CRDs + ingress (same chart as Terraform)
        run: |
          helm repo add traefik https://traefik.github.io/charts
          helm install traefik traefik/traefik --version 33.2.1 -n traefik --create-namespace \
            --set service.type=NodePort --wait

      - name: Pull the exact images that were just pushed and load into kind
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"; tag="${{ needs.images.outputs.tag }}"
          for c in backend frontend; do
            docker pull "ghcr.io/${owner}/devsecops360-$c:$tag"
            docker tag "ghcr.io/${owner}/devsecops360-$c:$tag" "devsecops360-$c:local"
            docker tag "ghcr.io/${owner}/devsecops360-$c:$tag" "devsecops360-$c:candidate"
          done
          docker pull postgres:16-alpine
          kind load docker-image --name devsecops360 devsecops360-backend:local devsecops360-frontend:local \
            devsecops360-backend:candidate postgres:16-alpine

      - name: Validate manifests server-side
        run: kubectl apply -k kubernetes/overlays/development --dry-run=server

      - name: Deploy (v1 = blue)
        run: |
          bash deployment/scripts/create-secrets.sh
          kubectl apply -k kubernetes/overlays/development
          kubectl -n "$NAMESPACE" rollout status statefulset/postgres --timeout=300s
          kubectl -n "$NAMESPACE" wait --for=condition=complete job/db-migrate --timeout=300s
          kubectl -n "$NAMESPACE" rollout status deploy/backend-blue --timeout=300s
          kubectl -n "$NAMESPACE" rollout status deploy/frontend --timeout=180s

      - name: Blue-green deploy candidate → green
        run: bash deployment/scripts/blue-green-deploy.sh devsecops360-backend:candidate

      - name: Rollback drill (green → blue) and measure
        run: bash deployment/rollback/rollback.sh

      - name: Self-healing check — kill a backend pod, expect replacement
        run: bash scripts/chaos/kill-pod.sh

      - name: Evidence
        if: always()
        run: |
          bash deployment/scripts/status.sh || true
          kubectl -n "$NAMESPACE" get all,networkpolicy,pdb,hpa -o wide || true
          kubectl -n "$NAMESPACE" get events --sort-by=.lastTimestamp | tail -50 || true

  gitops-bump:
    name: GitOps — promote image tag to staging overlay
    needs: [images, deploy-verify]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - name: Update staging image tags
        run: |
          tag="${{ needs.images.outputs.tag }}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          f=kubernetes/overlays/staging/kustomization.yaml
          sed -i "s#ghcr.io/your-github-username#ghcr.io/${owner}#g" "$f"
          python3 - "$f" "$tag" <<'PY'
          import re, sys
          path, tag = sys.argv[1], sys.argv[2]
          s = open(path).read()
          s = re.sub(r"(newName: ghcr\.io/[^/]+/devsecops360-(?:backend|frontend)\n\s+newTag: )\S+", rf"\g<1>{tag}", s)
          open(path, "w").write(s)
          PY
          git diff --stat
      - name: Open promotion PR (Argo CD syncs staging after merge)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="promote/staging-${{ needs.images.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "chore(staging): promote ${{ needs.images.outputs.tag }}" || exit 0
          git push origin "$branch"
          gh pr create --title "Promote ${{ needs.images.outputs.tag }} to staging" \
            --body "Automated promotion after the image passed scanning, signing and the blue-green + rollback drill on an ephemeral cluster." \
            --base main --head "$branch"
